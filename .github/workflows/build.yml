name: Build TWRP Infinix X6515

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v3
      with:
        path: device/infinix/X6515

    - name: Cleanup Disk Space
      uses: rokibhasansagar/slim_disk_space@main

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "yasaz"
        git config --global user.email "yasaz@example.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Build Recovery Image
      run: |
        cd twrp
        mv ../device device/
        source build/envsetup.sh
        lunch omni_Infinix-X6515-eng || lunch twrp_Infinix-X6515-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TWRP_Infinix_X6515
        path: twrp/out/target/product/X6515/recovery.img
